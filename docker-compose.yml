services:
  db:
    image: postgres:15
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reembolso_api_development
    ports:
      - "5433:5432"

  web:
    build: .
    depends_on:
      - db
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: "postgres://postgres:password@db:5432/reembolso_api_development"
    command: ["rails", "server", "-b", "0.0.0.0"]

volumes:
  db_data:
